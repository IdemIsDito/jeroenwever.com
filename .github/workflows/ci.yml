name: CI

on:
  push:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Browsers are cached per lockfile, so most runs skip the download entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # System deps come from apt, which has hung for hours on a held lock.
      # Bounded and non-fatal: the runner image usually carries them already,
      # and if it genuinely does not, the site tests fail loudly a step later.
      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 5
        continue-on-error: true

      - name: Install Playwright Chromium
        run: bunx playwright install chromium
        timeout-minutes: 5

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Build (site + PDFs + OG images)
        run: bun run build

      - name: Site tests (smoke, assets, theme, axe)
        run: bun run test:site

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jeroenwever-com --branch=${{ github.ref_name }}
